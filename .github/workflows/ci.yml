name: Commerce foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: commerce
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: test_only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://commerce:test_only@127.0.0.1:5432/commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/test_rehearsal.cjs
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest tests -q
      - name: Shared-store PostgreSQL transaction tests
        run: pytest tests/test_commerce.py -q
        env:
          COMMERCE_TEST_DATABASE_URL: postgresql+psycopg://commerce:test_only@127.0.0.1:5432/commerce
      - run: docker build -t commerce-api:ci .
      - run: docker build -f Dockerfile.commerce -t commerce-store:ci .
