services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: commerce_store
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - commerce_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce_store"]
      interval: 3s
      timeout: 3s
      retries: 20
  setup:
    build:
      context: .
      dockerfile: Dockerfile.commerce
    environment: &commerce_env
      COMMERCE_DATABASE_URL: postgresql+psycopg://commerce:${DB_PASSWORD}@db:5432/commerce_store
      PAYMENT_MODE: sandbox
      PUBLIC_ORIGIN: http://127.0.0.1:8000
    command: ["python", "-m", "app.manage", "seed"]
    depends_on:
      db:
        condition: service_healthy
  store:
    build:
      context: .
      dockerfile: Dockerfile.commerce
    environment: *commerce_env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      setup:
        condition: service_completed_successfully
  worker:
    build:
      context: .
      dockerfile: Dockerfile.commerce
    environment: *commerce_env
    command: ["python", "-m", "app.manage", "worker"]
    depends_on:
      setup:
        condition: service_completed_successfully
volumes:
  commerce_data:
