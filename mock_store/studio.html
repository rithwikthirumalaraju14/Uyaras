<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>T-shirt Studio · Demo shop</title><style>
:root{--ink:#152823;--green:#174e3e;--muted:#476057;--border:#c9d5ce;--paper:#fbfcfa;--tint:#e7eee7}*{box-sizing:border-box}body{margin:0;font:16px/1.5 "DM Sans",Arial,sans-serif;color:var(--ink);background:var(--paper)}button,input,textarea,select{font:inherit;color:inherit}a{color:var(--green)}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px max(4%,calc((100% - 1240px)/2));background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap}nav,.row,.actions,.pills{display:flex;align-items:center;gap:10px;flex-wrap:wrap}nav button,.link{background:transparent;border:0;font-size:.95rem;padding:7px 8px}.word{font:italic bold 1.55rem Georgia,serif;color:var(--green);border:0;background:none;white-space:nowrap}.ribbon{background:#183a30;color:white;text-align:center;padding:6px;font-size:.88rem}main,footer{max-width:1320px;padding:22px 4% 38px;margin:auto}footer{border-top:1px solid var(--border);color:var(--muted)}h1,h2,h3,p{margin:0 0 .7rem}h1,h2,.product-name{font-family:Georgia,serif;font-weight:normal;line-height:1.08}h1{font-size:clamp(2.4rem,5vw,4.6rem);letter-spacing:-.045em}h2{font-size:1.9rem}h3{font-size:1.1rem}.hero{display:grid;grid-template-columns:1fr 1fr;background:#dde8dd;margin-bottom:32px;overflow:hidden;border-radius:4px}.hero>div{align-self:center;padding:clamp(22px,4vw,60px)}.hero img{width:100%;height:300px;object-fit:contain;background:#e7e8dd}.hero h1{max-width:9em}.hero p{color:#354c42}.btn,.pill{background:white;border:1px solid var(--border);border-radius:4px;padding:8px 14px}.primary,.pill[aria-pressed=true]{background:var(--green);border-color:var(--green);color:white}.pills{margin:16px 0}.toolbar,.panel,.tile{border:1px solid var(--border);background:white;padding:16px;border-radius:6px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 20px}.toolbar label{flex:1;min-width:105px}.toolbar input,.toolbar select{width:100%}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{border:0;background:transparent;text-align:left;padding:0}.card img,.photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;background:var(--tint)}.card .product-name{font-size:1.45rem;display:block;margin:4px 0}.card .meta{display:block;margin-top:7px}.meta,small,.note{color:var(--muted);font-size:.92rem}.columns{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,4vw,54px)}.panel,.tile,details{margin:12px 0}.stack{display:grid;gap:12px}input,select,textarea{padding:8px 10px;border:1px solid #9cad9f;border-radius:4px;background:#fff;max-width:100%}label{display:grid;gap:4px;font-size:.95rem}label input[type=checkbox]{width:auto}.form{display:grid;gap:12px;align-content:start}.price{font-size:1.35rem;font-weight:bold}.sectionhead{display:flex;align-items:baseline;gap:16px;justify-content:space-between;flex-wrap:wrap}.thumb{width:66px;height:66px;border-radius:4px;object-fit:cover}.spread{justify-content:space-between}.notice{background:var(--tint);padding:12px 16px;border-radius:5px;margin:10px 0}.status{position:sticky;top:0;z-index:2;background:#174e3e;color:white;padding:8px 4%}.status:empty{display:none}.danger{color:#983a26}.amounts{display:grid;grid-template-columns:1fr auto;gap:5px}.amounts strong{text-align:right}summary{cursor:pointer;font-weight:600;padding:5px 0}ul,ol{padding-left:1.2rem}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b67715;outline-offset:2px}.skip{position:absolute;left:-100vw}.skip:focus{left:4px;background:white;padding:6px}.staffnav{margin:14px 0}.sr{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
