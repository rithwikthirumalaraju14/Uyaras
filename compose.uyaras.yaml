services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uyaras
      POSTGRES_USER: uyaras
      POSTGRES_PASSWORD: ${UYARAS_DB_PASSWORD:?Run start.ps1 to generate the local secret}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - uyaras_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uyaras -d uyaras"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  uyaras_pg:
